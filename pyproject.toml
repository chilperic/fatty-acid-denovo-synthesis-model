[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fadns-model"
version = "0.2.0"
description = "Semi-mechanistic fatty acid de novo synthesis model workflows."
authors = [{name = "Chilperic Armel Foko Kuate"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.4", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/chilperic/fatty-acid-denovo-synthesis-model"
Issues = "https://github.com/chilperic/fatty-acid-denovo-synthesis-model/issues"
